<!DOCTYPE html>
<html>
    <HEAD>
        <title>AI POWERED JOB APPLICATION ASSISTANT</title>
        <style>
            .error {
                color: red;
                margin-bottom: 10px;
            }
        </style>
    </HEAD>
    <BODY style="background-color:#33FFFF;">
    <form id="login" action="/login" method="post">
        <h1 style="color:darkblue;text-align:center;">
            WELCOME TO JOB APPLICATION ASSISTANT
        </h1>

        <div id="errorMsg" class="error" style="text-align:center;"></div>

    <div style="display:flex; justify-content:center;">
        <table>
            <tr>
                <td style="color: blue;">
                    USERNAME
                </td>
                <td>
                    <input name="username" id="username" type="text" size="20">
                </td>
            </tr>
             <tr>
                <td style="color: blue;">
                    PASSWORD
                </td>
                <td>
                    <input name="password" id="password" type="password" size="20">
                </td>
            </tr>
             <tr>
                <td style="color: blue;">
                    <input type="submit">
                </td>
                <td style="color: blue;">
                    <input type="button" value="SIGN UP">
                </td>
            </tr>
        </table>
    </div>
</form>
<script>
document.getElementById("login").addEventListener("submit", async function(event) {
    let username = document.getElementById("username").value.trim();
    let password = document.getElementById("password").value.trim();

    let errorMsg = document.getElementById("errorMsg");
    errorMsg.innerHTML = "";

    if (username === "") {
        event.preventDefault();
        errorMsg.innerHTML = "Username is required.";
        return;
    }

    if (password === "") {
        event.preventDefault();
        errorMsg.innerHTML = "Password is required.";
        return;
    }
    event.preventDefault();

    const formData = new FormData(this);

    const response = await fetch("/login", {
        method: "POST",
        body: formData
    });

    const data = await response.json();
    if (!response.ok) {
        errorMsg.textContent = data.error;
        return;
    }
    localStorage.setItem("token", data.access_token);
    if (response.ok) {
        window.location.href = data.redirect;
    }
});
</script>

</BODY>

</html>
