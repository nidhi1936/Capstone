<!DOCTYPE html>
<html>
    <head>
        <title>AI POWERED JOB APPLICATION ASSISTANT</title>
        <style>
            .error {
                color: red;
                margin-bottom: 10px;
            }
            .result {
                color: blue;
                margin-bottom: 10px;
            }
        </style>
        

    </head>
    <body style="background-color: #33FFFF;">
        <form id="upload-pdf" action="/upload-pdf" method="post" enctype="multipart/form-data">
            <h1 style="color:darkblue;text-align:center;">
            WELCOME TO JOB APPLICATION ASSISTANT
        </h1>

        <div id="errorMsg" class="error" style="text-align:center;"></div>

        <div style="display:flex; justify-content:center;">
        <table>
            <tr>
                <td style="color: blue;">
                    UPLOAD RESUME PDF ONLY
                </td>
                <td>
                    <input name="file" id="file" type="file">
                </td>
            </tr>
             <tr>
                <td style="color: blue;">
                    JOB DESCRIPTION
                </td>
                <td>
                    <textarea name="jd" id="jd"></textarea>
                </td>
            </tr>
             <tr>
                <td style="color: blue;" colspan="2">
                    <input id="submit" type="submit" VALUE="UPLOAD RESUME">
                </td>
            </tr>
        </table>
    </div>
        </form>
    <div id="result" class="result" style="text-align:center; margin: 20PX AUTO; width: 50%;"></div>
    <div style="text-align: center;"><button id="display" onclick="display" style="text-align:center;display:none">DISPLAY PDF</button></div>
    <script>
        let params="";
        document.getElementById("upload-pdf").addEventListener("submit", async function(event) {
    let file = document.getElementById("file").value.trim();
    let jd = document.getElementById("jd").value.trim();

    let errorMsg = document.getElementById("errorMsg");
    errorMsg.innerHTML = "";

    if (file === "") {
        event.preventDefault();
        errorMsg.innerHTML = "PDF File is required.";
        return;
    }

    if (jd === "") {
        event.preventDefault();
        errorMsg.innerHTML = "Job Description is required.";
        return;
    }
    event.preventDefault();
    document.getElementById("submit").style.display="none";
    const formData = new FormData(this);

    const response = await fetch("/upload-pdf", {
        method: "POST",
        body: formData
    });
    
    const data = await response.json();
    if (data.error){
        errorMsg.textContent=data.error;
        return;
    }
    params=data.params;
    if (data.fit_analysis=="False") {
        result.textContent = data.message;
        return;
    }
    result.textContent = data.message;
    document.getElementById("display").style.display="inline";
});
    document.getElementById("display").addEventListener("click", function () {
        window.location.href = "/display?"+params;
});
    </script>
    </body>
</html>
