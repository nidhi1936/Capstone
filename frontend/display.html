<!DOCTYPE html>
<html>
<head>
    <title>AI POWERED JOB APPLICATION</title>
    
    <style>
        body {
            margin: 0;
            background-color: #33FFFF;
            font-family: Arial, sans-serif;
        }

        .container {
            display: flex;
            height: 100vh;
            gap: 10px;
            padding: 10px;
            box-sizing: border-box;
        }

        .pdf-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
        }

        .pdf-panel h3 {
            color: darkblue;
            text-align: center;
            margin: 5px 0;
        }

        iframe {
            flex: 1;
            width: 100%;
            border: 1px solid #ccc;
        }
    </style>
</head>

<body>

<div class="container">

    <div class="pdf-panel">
        <h3>Original Resume</h3>
        <iframe id="resume" src=""></iframe>
    </div>

    <div class="pdf-panel">
        <h3>AI Improved Resume</h3>
        <iframe id="resume_rewrite" src=""></iframe>
    </div>
    
</div>
<div class="container">
    <div class="pdf-panel">
        <h3>Cover Letter</h3>
        <iframe id="cover_letter" src=""></iframe>
    </div>

    <div class="pdf-panel">
        <h3>Mock Interview Questions and Answers</h3>
        <iframe id="mock_interview" src=""></iframe>
    </div>
</div>
<script>
document.addEventListener("DOMContentLoaded", () => {
    const params = new URLSearchParams(window.location.search);
    const resumeName = params.get("resume_name");
    document.getElementById("resume").src = resumeName;
    const name=resumeName.slice(0,-4);
    document.getElementById("resume_rewrite").src = name+"_updated.pdf";
    document.getElementById("cover_letter").src = name+"_cover_letter.pdf";
    document.getElementById("mock_interview").src = name+"_interview.pdf";
});
</script>
</body>
</html>
